# TPM by default installs plugins on the same directory as the config file; this prevents plugins from being installed at ~/.config/tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# vim hotkeys
setw -g mode-keys vi
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows
set -g renumber-windows on

set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -ag terminal-overrides ",xterm-ghostty:Tc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~nvim->nvim *"'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'xamut/tmux-weather'
set -g @tmux-weather-interval 15
set -g @tmux-weather-location "Koenji"
#set -g @tmux-weather-location "Mandaue"

# DESIGN TWEAKS
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5

# Catppuccin theme
# Remove tmux's own native space character between tabs
set -g window-status-separator ""

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Fix active window status not being set to "rounded"
#set -g @catppuccin_window_current_left_separator "#{@catppuccin_window_left_separator}"
#set -g @catppuccin_window_current_right_separator "#{@catppuccin_window_right_separator}"

run '~/.tmux/plugins/tmux/catppuccin.tmux'

# v2.3.0 config
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "

set -g status-left-length 300
set -g status-right-length 200
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -agF status-right "#{E:@catppuccin_status_weather}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
